version: '3.8'

services:

  redis-artfolio:
    image: redis:7
    container_name: redis-artfolio
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - artfolio_redis_data:/data

  postgres-artfolio:
    image: postgres:16
    container_name: postgres-artfolio
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: dbver
    ports:
      - "5433:5432"
    volumes:
      - artfolio_postgres_data:/var/lib/postgresql/data

volumes:
  artfolio_redis_data:
  artfolio_postgres_data: